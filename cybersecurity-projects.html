<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets Cybersécurité - Portfolio Interactif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #e94560, #d13453);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8d8d8d;
            font-size: 1.1em;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: rgba(22, 33, 62, 0.9);
            color: #f1f1f1;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
            background: rgba(15, 52, 96, 0.9);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #e94560, #d13453);
            color: white;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        #searchInput {
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            background: rgba(22, 33, 62, 0.95);
            color: #f1f1f1;
        }

        #searchInput::placeholder {
            color: #8d8d8d;
        }

        #searchInput:focus {
            outline: none;
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.3);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .project-card {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        .project-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .project-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .project-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #e94560;
        }

        .category-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .level-beginner {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: #84fab0;
        }

        .level-intermediate {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: #fccb90;
        }

        .level-advanced {
            background: linear-gradient(135deg, #e94560, #d13453);
            color: #fff;
        }

        .project-description {
            color: #8d8d8d;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 5px 12px;
            background: #0f3460;
            border-radius: 12px;
            font-size: 0.85em;
            color: #f1f1f1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            background: #16213e;
            margin: 50px auto;
            padding: 40px;
            max-width: 700px;
            border-radius: 20px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.4s ease;
            color: #f1f1f1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2em;
            cursor: pointer;
            color: #8d8d8d;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #e94560;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #d13453);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #8d8d8d;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
                gap: 20px;
            }

            .filter-buttons {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

            <div class="stat-item">

            <div class="stat-item">
                <div class="stat-number">25</div>

                <div class="stat-number">20</div>

        </div>
    </div>

        <div class="modal-content" id="modalContent">

            <div id="modalBody"></div>
        </div>
    </div>

            { id: 4, title: "Analyse comportementale de malwares", icon: "🦠", level: "beginner", category: "Détection & Analyse", description: "Étudier le comportement des malwares dans un environnement sandbox isolé pour comprendre leurs actions.", tags: ["Malware", "Sandbox", "Analyse"], details: "Créez un environnement d'analyse sécurisé avec VirtualBox et des outils comme Process Monitor pour observer l'activité des malwares sans risque." },
            { id: 5, title: "Développement d'outils de cracking", icon: "🔓", level: "beginner", category: "Authentification", description: "Créer des outils éducatifs pour tester la robustesse des mots de passe et sensibiliser à la sécurité.", tags: ["Password", "Cracking", "Éducatif"], details: "Développez des scripts Python utilisant des techniques de brute force et d'attaques par dictionnaire. Comprenez pourquoi des mots de passe forts sont essentiels." },
            { id: 6, title: "Implémentation 2FA robuste", icon: "🔐", level: "beginner", category: "Authentification", description: "Mettre en place une authentification à deux facteurs pour renforcer la sécurité des comptes utilisateurs.", tags: ["2FA", "Authentification", "Sécurité"], details: "Intégrez des solutions 2FA avec TOTP (Time-based One-Time Password) ou U2F. Utilisez des bibliothèques comme PyOTP ou Google Authenticator." },
            { id: 7, title: "Extension navigateur sécurisée", icon: "🌐", level: "beginner", category: "Authentification", description: "Développer une extension pour bloquer les trackers, détecter les sites de phishing et protéger la vie privée.", tags: ["Extension", "Navigateur", "Privacy"], details: "Créez une extension Chrome/Firefox qui analyse les URLs, bloque les scripts malveillants et alerte l'utilisateur des sites dangereux." },
            { id: 8, title: "Configuration avancée de firewall", icon: "🔥", level: "beginner", category: "Infrastructure", description: "Configurer des règles firewall complexes pour filtrer le trafic et protéger le réseau contre les intrusions.", tags: ["Firewall", "iptables", "Réseau"], details: "Maîtrisez iptables ou firewalld sous Linux. Créez des règles de filtrage par port, protocole et adresse IP pour sécuriser vos services." },
            { id: 9, title: "Scan de vulnérabilités avec Nmap", icon: "🔍", level: "beginner", category: "Infrastructure", description: "Utiliser Nmap et OpenVAS pour identifier les failles de sécurité dans les systèmes et réseaux.", tags: ["Nmap", "Scan", "Vulnérabilités"], details: "Découvrez les techniques de scanning réseau, détection de services, identification d'OS et recherche de vulnérabilités connues." },

            { id: 11, title: "Déploiement de Snort IDS", icon: "🚨", level: "beginner", category: "Infrastructure", description: "Installer et configurer Snort pour détecter les intrusions et analyser le trafic réseau en temps réel.", tags: ["Snort", "IDS", "Détection"], details: "Configurez Snort avec des règles personnalisées pour détecter les scans de ports, les attaques DoS et les tentatives d'exploitation." },
            { id: 12, title: "Chiffrement de fichiers", icon: "🔒", level: "beginner", category: "Cryptographie", description: "Implémenter différents algorithmes de chiffrement (AES, RSA) pour protéger la confidentialité des données.", tags: ["Chiffrement", "AES", "RSA"], details: "Développez des outils en Python pour chiffrer et déchiffrer des fichiers avec différents algorithmes. Comprenez la cryptographie symétrique et asymétrique." },
            { id: 13, title: "Communications sécurisées TLS/SSL", icon: "🛡️", level: "beginner", category: "Cryptographie", description: "Mettre en place des communications chiffrées avec TLS/SSL pour protéger les échanges de données.", tags: ["TLS", "SSL", "HTTPS"], details: "Configurez des certificats SSL/TLS sur un serveur web. Comprenez le handshake TLS et l'importance du chiffrement de bout en bout." },

            { id: 18, title: "Analyse forensique numérique", icon: "🔬", level: "beginner", category: "Forensics", description: "Enquêter sur des systèmes compromis pour retracer les actions des attaquants et récupérer des preuves.", tags: ["Forensics", "Investigation", "Preuves"], details: "Utilisez Autopsy et FTK Imager pour analyser les disques durs, récupérer des fichiers supprimés et identifier les traces d'intrusion." },
            { id: 19, title: "Utilisation de Tor et anonymisation", icon: "🕵️", level: "beginner", category: "Privacy", description: "Comprendre et utiliser Tor et d'autres outils pour protéger son anonymat en ligne.", tags: ["Tor", "Anonymat", "Privacy"], details: "Configurez Tor Browser et explorez le réseau Tor. Comprenez les principes du routage en oignon et ses limites." },
            { id: 20, title: "Étude pratique des exploits zero-day", icon: "💥", level: "beginner", category: "Forensics", description: "Analyser des vulnérabilités zero-day divulguées pour comprendre leur fonctionnement et leur impact.", tags: ["Zero-day", "Exploits", "CVE"], details: "Étudiez des CVEs récents, comprenez comment ils ont été découverts et exploités. Apprenez à patcher vos systèmes rapidement." },

            // Projets Intermédiaires

            { id: 22, title: "Reverse engineering de firmware", icon: "🔧", level: "intermediate", category: "Malware & RE", description: "Décompiler et analyser des firmwares de dispositifs IoT pour identifier des vulnérabilités cachées.", tags: ["Firmware", "IoT", "Reverse"], details: "Utilisez Binwalk et Ghidra pour extraire et analyser les firmwares. Recherchez des backdoors et des configurations par défaut dangereuses." },

            { id: 24, title: "Techniques d'obfuscation de malware", icon: "🎨", level: "intermediate", category: "Malware & RE", description: "Étudier les méthodes d'obscurcissement de code pour éviter la détection par les antivirus.", tags: ["Obfuscation", "Évasion", "Malware"], details: "Comprenez le packing, la cryptographie polymorphe et les techniques anti-débogage utilisées par les malwares modernes." },

            { id: 67, title: "Bug Bounty et divulgation responsable", icon: "💰", level: "advanced", category: "Analyse de risques", description: "Participer à des programmes de bug bounty et maîtriser l'art de la divulgation responsable.", tags: ["Bug Bounty", "Responsible Disclosure", "HackerOne"], details: "Chassez les bugs sur HackerOne, BugCrowd. Rédigez des rapports professionnels et suivez les procédures de divulgation éthique." },
            { id: 68, title: "Incident Response Automation", icon: "🤖", level: "advanced", category: "SOAR", description: "Automatiser la réponse aux incidents de sécurité avec des playbooks SOAR (Security Orchestration).", tags: ["SOAR", "Automation", "Incident Response"], details: "Développez des playbooks avec Phantom ou Demisto. Automatisez l'enrichissement des alertes, le confinement et la remédiation." },
            { id: 69, title: "Threat Hunting proactif", icon: "🎯", level: "advanced", category: "SOAR", description: "Rechercher proactivement des menaces cachées dans votre infrastructure avant qu'elles ne causent des dommages.", tags: ["Threat Hunting", "Proactive", "EDR"], details: "Utilisez des hypothèses basées sur MITRE ATT&CK. Analysez les logs, comportements anormaux et IOCs avec des outils EDR et SIEM." },
            { id: 70, title: "Cyber Threat Intelligence Platform", icon: "🌐", level: "advanced", category: "SOAR", description: "Construire une plateforme de threat intelligence centralisée agrégeant des feeds multiples.", tags: ["CTI", "MISP", "OpenCTI"], details: "Déployez MISP ou OpenCTI. Intégrez des feeds commerciaux et open-source. Automatisez le partage de IOCs et la corrélation avec vos événements." }
        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            const filteredProjects = projects.filter(project => {
                const matchesFilter = currentFilter === 'all' || project.level === currentFilter;
                const matchesSearch = project.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    project.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    project.category.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    project.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()));
                return matchesFilter && matchesSearch;
            });

            document.getElementById('totalProjects').textContent = filteredProjects.length;

            filteredProjects.forEach((project, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                const levelClass = `level-${project.level}`;
                const levelText = project.level === 'beginner' ? 'Débutant' : 
                                project.level === 'intermediate' ? 'Intermédiaire' : 'Avancé';

                card.innerHTML = `
                    <div class="project-header">
                        <div class="project-icon">${project.icon}</div>
                        <div class="project-title">${project.title}</div>
                    </div>
                    <div class="category-badge ${levelClass}">${levelText} • ${project.category}</div>
                    <div class="project-description">${project.description}</div>
                    <div class="project-tags">
                        ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                `;

                card.addEventListener('click', () => openModal(project));
                grid.appendChild(card);
            });
        }

        function openModal(project) {
            const modal = document.getElementById('projectModal');
            const modalBody = document.getElementById('modalBody');
            
            const levelClass = `level-${project.level}`;
            const levelText = project.level === 'beginner' ? 'Débutant' : 
                            project.level === 'intermediate' ? 'Intermédiaire' : 'Avancé';

            modalBody.innerHTML = `
                <div class="project-header">
                    <div class="project-icon" style="font-size: 3em;">${project.icon}</div>
                    <div>
                        <h2 style="color: #e94560; margin-bottom: 10px;">${project.title}</h2>
                        <div class="category-badge ${levelClass}">${levelText} • ${project.category}</div>
                    </div>
                </div>
                <h3 style="margin-top: 30px; color: #e94560;">📋 Description</h3>
                <p style="margin: 15px 0; line-height: 1.8; color: #8d8d8d;">${project.description}</p>
                
                <h3 style="margin-top: 25px; color: #e94560;">🔍 Détails du projet</h3>
                <p style="margin: 15px 0; line-height: 1.8; color: #8d8d8d;">${project.details}</p>
                
                <h3 style="margin-top: 25px; color: #e94560;">🏷️ Technologies & Compétences</h3>
                <div class="project-tags" style="margin-top: 15px;">
                    ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>

                <div style="margin-top: 30px; padding: 20px; background: linear-gradient(135deg, rgba(233, 69, 96, 0.1), rgba(209, 52, 83, 0.1)); border-radius: 10px; border-left: 4px solid #e94560;">
                    <strong style="color: #e94560;">💡 Conseil :</strong> 
                    <p style="margin-top: 10px; color: #8d8d8d;">
                        ${getProjectTip(project.level)}
                    </p>
                </div>
            `;

            modal.style.display = 'block';
        }

        function getProjectTip(level) {
            const tips = {
                beginner: "Commencez par créer un environnement de lab virtuel sécurisé. Documentez chaque étape et n'hésitez pas à refaire plusieurs fois pour bien comprendre.",
                intermediate: "Ce projet nécessite de bonnes bases. Consultez la documentation officielle des outils et rejoignez des communautés pour échanger sur les difficultés rencontrées.",
                advanced: "Projet complexe qui demande de l'expérience. Décomposez-le en sous-tâches, testez en environnement isolé et gardez une trace de vos découvertes pour la communauté."
            };
            return tips[level];
        }

        function closeModal() {
            document.getElementById('projectModal').style.display = 'none';
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-level');
                renderProjects();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchTerm = e.target.value;
            renderProjects();
        });

        window.onclick = function(event) {
            const modal = document.getElementById('projectModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Initial render
        renderProjects();
    </script>
</body>
